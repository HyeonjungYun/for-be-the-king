# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: client_side_fow_masking
    status: active
    description: "전장의 안개(FoW)를 클라이언트 시각 마스킹(안개 오버레이·액터 숨김)으로 구현 금지.
      시야 밖 액터는 서버가 애초에 리플리케이트하지 않아야 한다(서버권위 relevancy 컬링).
      HUD·미니맵·렌더 레이어는 이미 서버가 보낸 액터만 그린다 — 클라가 받은 액터를 숨기는 방식 금지."
    why: "클라가 시야 밖 액터 데이터를 받으면 메모리 스니핑/월핵으로 노출된다. 풀루팅 익스트랙션에서
      위치 정보 유출은 치명적 치트 벡터. FoW는 시각 효과가 아니라 안티치트 근간이다."
    adr: docs/architecture/adr-0001-netcode-replication-backbone.md
    added: 2026-07-18
  - pattern: predict_authoritative_gameplay
    status: active
    description: "데미지 크기·크리티컬 결과·CC 적용/지속·사망(킬) 확정을 클라이언트 예측 금지.
      GAS 예측은 어빌리티 발동·코스트·쿨다운·캐스트 큐/몽타주 시작에만 한정. 이 결과값들은
      서버 전용 계산 후 리플리케이트만."
    why: "풀루팅 PvP에서 예측된 킬이 서버에서 뒤집히면 오사망 연출·조기 루팅자격·잘못된 익스트랙션 상태 등
      심각한 UX/경제 문제. 크리 RNG 클라 예측은 서버와 desync + 치트 벡터. 안티치트·공정성 근간."
    adr: docs/architecture/adr-0002-gas-adoption.md
    added: 2026-07-19

