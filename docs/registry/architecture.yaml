#       - docs/architecture/adr-0001-health-system.md
#       - docs/architecture/adr-0003-combat-system.md   # reads to apply damage
#       - docs/architecture/adr-0007-ui-system.md       # reads to display HUD
#     added: 2026-03-26
#     revised: ""


# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: fow_relevancy_decision
    status: active
    pattern: direct_call      # 백본별 어댑터가 시야 시스템의 단일 판정 함수를 호출
    producer: vision-system   # 시야/릴러번시 (#13)
    consumers:
      - networking-layer      # 백본 어댑터(Iris filter / RepGraph node)가 판정 결과로 relevancy 결정
    adr: docs/architecture/adr-0001-netcode-replication-backbone.md
    signal_signature: "ShouldReplicateActorToConnection(Actor, Connection) -> bool (서버권위, LOS/방-차폐 포함)"
    referenced_by:
      - docs/architecture/adr-0001-netcode-replication-backbone.md
    added: 2026-07-18
    revised: ""
    note: "백본(Iris vs RepGraph)은 PoC 미확정이나, relevancy 판정을 시야 시스템 뒤로 캡슐화한다는 계약은 백본 선택과 무관하게 확정."

