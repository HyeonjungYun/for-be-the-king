; ── 개발용 로그인 (2026-09-12) ────────────────────────────────────────────────
;
; 토큰을 소스에 박아두면 계정을 바꿀 때마다 클라 리빌드가 필요하다.
; S1GameInstance::ResolveLoginToken 이 아래 값을 읽는다.
;
;   DevLoginAccount   시딩 계정 이름. 토큰 = SHA256(이름)
;                     seed_bots.sql · seed_dev.sql 이 그 규칙으로 넣어두기 때문에 성립한다
;   DevLoginToken     64자 토큰 직접. AuthServer 가 발급한 것을 쓸 때
;
; 우선순위: 명령줄 -token= > 명령줄 -account= > DevLoginToken > DevLoginAccount
;
; 🔴 여러 클라를 다른 계정으로 띄울 때는 ini 가 아니라 명령줄을 쓴다.
;    같은 계정으로 둘을 띄우면 AccountManager 가 두 번째를 거절한다.
;
;      "dev_1","bot_1","bot_2","bot_3" | ForEach-Object {
;          Start-Process $exe -ArgumentList "-account=$_", "-WINDOWED"
;      }
;
; 🔴 이것은 개발 우회다. 제품 로그인 절차(가입 · 캐릭터 생성 · 캐릭터 선택)는
;    아직 없다 — C_CREATE_CHARACTER 패킷이 없고 캐릭터는 SQL 로만 만들어진다.

[/Script/S1.S1GameInstance]
DevLoginAccount=dev_1
