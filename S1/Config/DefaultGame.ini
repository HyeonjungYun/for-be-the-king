; ── 아이템 UI 모델 (2026-10-03) ──────────────────────────────────────────────
;
; design/ux/item-ui.md § Data Requirements — 값은 여기에 둔다. 코드에 리터럴 금지.
;
; 🔴 LootRangeCm 은 서버 Room.cpp 의 LOOT_RANGE_CM 복제다. 서버가 보내 주기 전까지
;    둘을 같이 고친다. 어긋나면 F 가 서버가 거절할 가방을 고르거나, 열 수 있는 가방을 놓친다.

;
; ItemDataDirectory — 프로젝트 폴더 기준. 서버의 Server/Data 를 그대로 읽어 원천을 하나로 둔다.
;    🔴 개발 전용 경로다. 패키징하면 이 폴더가 없다 — 그때 방식을 따로 정한다.
; GradeMultipliers — 일반 · 희귀 · 영웅 · 전설 (entities.yaml grade_multiplier)

