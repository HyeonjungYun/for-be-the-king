; ── 베이스캠프 흐름 (UI 4단계, 2026-10-04) ───────────────────────────────────────
;
; DeathReturnSeconds — 내 캐릭터가 죽고 베이스캠프(S3)로 자동으로 돌아가기까지의 초 (사용자 결정 3초).
;    사망 연출이 생기면 이 시간 안에 넣는다.
; EntryDataDirectory — S4 진입 지점 지도가 읽는 entry_points.csv 위치. 서버 파일을 그대로 읽는다(ItemDataDirectory 와 같음).
; MapHalfExtentCm — S4 가 그리는 정사각형 층 범위의 절반(cm). 해안선(floor_outline.csv)이 없는 층에만 쓴다.
;    1층 Floor1 은 2026-10-11 부터 섬(589 × 306 m)이라 해안선의 경계 상자 + 4 % 로 그린다 — 이 값은 해안선 없는
;    층(2~4층 TEMP)의 옛 280 m 정사각형 기준. 3000 은 TEMP 진입 지점(±20 m) 시절 값 (2026-10-07 Migration 4 로 바꿈)

