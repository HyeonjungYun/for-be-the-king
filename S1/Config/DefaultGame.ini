; ── 개발용 로그인 (2026-09-12) ────────────────────────────────────────────────
;
; 토큰을 소스에 박아두면 계정을 바꿀 때마다 클라 리빌드가 필요하다.
; S1GameInstance::ResolveLoginToken 이 아래 값을 읽는다.
;
;   우선순위    명령줄 -token=<64자>   >   DevLoginToken
;
; 아래 값은 dev_1 의 토큰이다 (= SHA256("dev_1"), 2027-08-31 만료).
; 에디터에서 Play 를 누르면 이 값이 쓰인다.
;
; 🔴 여러 클라를 다른 계정으로 띄울 때는 ini 가 아니라 tools/dev-launch.ps1 을 쓴다.
;    ini 는 값이 하나라 클라가 전부 같은 계정이 되고, 같은 계정으로 둘을 띄우면
;    AccountManager 가 두 번째를 거절한다.
;
;      .\tools\dev-launch.ps1 dev_1 bot_1 bot_2 bot_3
;
; 🔴 계정명으로 토큰을 계산하는 경로는 클라에 두지 않았다. UE 는 Windows 에서
;    SHA-256 을 제공하지 않는다 — FPlatformMisc::GetSHA256Signature 의 Generic 구현이
;    checkf(false) 로 막혀 있고 Windows 오버라이드가 없다
;    (GenericPlatformMisc.cpp:2019). 변환은 dev-launch.ps1 이 한다.
;
; 🔴 이것은 개발 우회다. 2026-10-09 부터 DevLoginToken 은 **에디터 바이너리(PIE · -game)에서만** 읽힌다 —
;    패키징 빌드는 무시하고 로그인 화면을 띄운다 (US1LoginSubsystem::HasDevToken, WITH_EDITOR).
;    시드 계정(dev_1 · bot_N)은 비밀번호가 없어 로그인 화면으로는 들어갈 수 없어서 남겨 둔다.
;    명령줄 -token= 은 어느 빌드에서나 로그인 화면을 건너뛴다 (dev-launch · 봇).

[/Script/S1.S1GameInstance]
DevLoginToken=9f32e2436dd0db4a5737ca5611fa747d77a7273309877c94881b38d42a2c98fe

; ── 제품 로그인 (2026-10-09, ADR-0011) ──────────────────────────────────────────
;
; 로그인 화면(L1 아이디 · 비밀번호 → L2 캐릭터 이름)이 인증 서버(Server/AuthServer)에 HTTP 로 묻고,
; 받은 토큰으로 게임 서버에 접속한다. 게임 서버 주소도 여기서 정한다 (개발 우회 접속도 이 주소를 쓴다).
;
; 🔴 AuthServerUrl 은 http 다 — 비밀번호가 평문으로 오간다. 같은 공간 LAN 플레이테스트까지만.
;    인터넷 원격이면 https 가 필요하다 (account-login-mvp-2026-10-09.md OQ-1 · ADR-0011 R-1).
; RequestTimeoutSeconds — HTTP 모듈 기본 총 시간은 무제한이다. 인증 서버가 죽어 있으면 이만큼 뒤에 "연결할 수 없다".
; 🔴 URL 은 따옴표로 감싼다 — 따옴표가 없으면 값이 "http:" 에서 잘린다 (2026-10-09 실기동에서 겪음. 엔진 BaseEngine.ini 도 URL 을 감싼다)

[/Script/S1.S1LoginSubsystem]
AuthServerUrl="http://127.0.0.1:8080"
GameServerHost=127.0.0.1
GameServerPort=7777
RequestTimeoutSeconds=10

; ── 아이템 UI 모델 (2026-10-03) ──────────────────────────────────────────────
;
; design/ux/item-ui.md § Data Requirements — 값은 여기에 둔다. 코드에 리터럴 금지.
;
; 🔴 LootRangeCm 은 서버 Room.cpp 의 LOOT_RANGE_CM 복제다. 서버가 보내 주기 전까지
;    둘을 같이 고친다. 어긋나면 F 가 서버가 거절할 가방을 고르거나, 열 수 있는 가방을 놓친다.

;
; ItemDataDirectory — 프로젝트 폴더 기준. 서버의 Server/Data 를 그대로 읽어 원천을 하나로 둔다.
;    🔴 개발 전용 경로다. 패키징하면 이 폴더가 없다 — 그때 방식을 따로 정한다.
; 등급 배율(일반 · 희귀 · 영웅 · 전설)은 2026-10-07 부터 Server/Data/item_grades.csv - 서버 ItemTable 이 전투에
;    쓰는 같은 파일이다. 예전 +GradeMultipliers 는 클라만 읽어 툴팁과 판정이 갈라질 수 있었다 (ADR-0009)

