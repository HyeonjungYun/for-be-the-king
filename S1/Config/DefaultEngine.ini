[/Script/Engine.RendererSettings]
r.AllowStaticLighting=False
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
; 🔴 Lumen 해제 (2026-09-03) — production/roadmap.md P2 의 하드 데드라인(09-21)
;
;    탑다운 고정 시점이라 카메라가 멀고 캐릭터가 작게 보인다. Lumen 이 만드는
;    간접광의 미세한 차이가 화면에서 거의 읽히지 않는데, 비용은 그대로 든다.
;
;    P3(레벨 제작) 이전에 꺼야 하는 이유는 성능이 아니라 재작업이다.
;    Lumen 을 켠 채로 라이팅을 잡으면 나중에 끌 때 전부 다시 해야 한다.
;
;    GI 대안은 None 뿐이다 — ScreenSpace 는 UE 5.8 에서 deprecated 다
;    (EngineTypes.h: ScreenSpace UMETA(DisplayName="Screen Space (Deprecated)")).
;    반사는 SSR(2)이 살아 있어 저비용으로 유지한다.
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=2
r.SkinCache.CompileShaders=True

; Lumen 하드웨어 레이트레이싱이 사라졌으므로 함께 끈다.
; 셰이더 순열이 줄어 컴파일 시간과 메모리가 내려간다
r.RayTracing=False
r.RayTracing.RayTracingProxies.ProjectEnabled=False
r.Substrate=True
r.Substrate.ProjectGBufferFormat=0
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.LocalExposure.HighlightContrastScale=0.8
r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8

