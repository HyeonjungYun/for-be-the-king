deprecated:

  - name: effective_move_speed (구버전)
    was: "base=600 · flat 상한 150 · output [300, 900]"
    reason: base_move_speed 600 → 340 전면 재계산. 현행은 base=340 · flat 상한 85 · output [170, 510].

  - name: dash_kinematics.dash_speed (구버전)
    was: "800–2400 cm/s"
    reason: >
      base 재계산으로 450–1360 cm/s (동일 배율 1.33x~4x 유지).
      **부분 폐기** — `dash_dist`(200–800)·`dash_duration`(0.15–0.4 s)은 base 무관값이라 그대로 유효.

  - name: server_speed_validation_instantaneous
    was: "Δ거리 ÷ Δ시간 ≤ effective_move_speed(player) × 1.15"
    reason: >
      🔴 **2026-08-11 실측으로 반증.** "서버 실측 타임스탬프로 재면 지연 변동이 분모에서 상쇄된다"는
      근거가 틀렸다. 패킷이 일찍 도착해도 그 안에 담긴 이동량은 줄지 않으므로, 클라 시뮬레이션 간격
      (분자)과 서버 도착 간격(분모)이 어긋난 비율이 그대로 오차가 된다.
      실측: 클라 46ms 주기 · 서버 도착 27~59ms(±35%) → 15.6cm 이동이 **578 cm/s** 로 계산되어
      정상 걷기가 거부됨(`speed=464.5 dt=0.0269 dist=12.51`).
      **대체**: 이동 예산 모델 (`move_budget_max_sec`). 순간값이 아니라 누적량을 보므로 지터에 둔감하다.
      `min_delta_t`(16.6ms)도 함께 폐기 — 나눗셈이 사라져 불필요.

  - name: cc_duration_dr
    was: "DR_multiplier = max(DR_floor, DR_factor ^ stack_count), 창 15 s, 바닥 25%"
    reason: >
      반복 이력 기반 지수 감쇠 → **저항력 스탯**(반복 무관 선형 완화)으로 메커니즘 자체가 교체됨.
      대체 공식: `cc_effective_duration` (2026-08-11 확정, 경감 상한 40%).
      🔴 주의 — 체인 CC 방지 책임은 이 공식이 아니라
      **"하드 CC = 무기 부위 전용, 캐릭터당 1개"라는 구조적 제약**이 넘겨받았다.
      감쇠 곡선 튜닝 문제에서 **아이템화 문제**로 성격이 바뀌었다.

  - name: damage_dealt / crit_damage / attack_speed_stacking
    status: 판단 보류 (폐기 아님)
    reason: >
      공식 자체는 캐릭터 레벨을 변수로 갖지 않아 살아남는다.
      다만 스탯을 "장비 **/ 성장** 공동 공급"으로 전제했는데 성장이 사라졌으므로,
      `K_mitigation=100` · `as_max_ratio=2.5×` 같은 상수를 재검증해야 한다.
      combat-system.md 작성 시 등록.

  - name: input_buffer_window / target_acquisition_leniency
    status: 등록 보류 (폐기 아님)
    reason: >
      값(150 ms / 30 px)은 유효할 가능성이 높으나 `design/gdd/input-system.md`가 아직 없어
      source 경로가 무효하다. 해당 GDD 작성 시 등록.
      단 `target_acquisition_leniency` 30 px는 카메라가 확정된 지금 실측 재검증 권장.
