# Entity Registry — For be the King (가제)
#
# 여러 GDD가 공유하는 **사실(값)의 단일 소유처**.
# 여기 등록된 값을 다른 문서가 다르게 쓰면 그것은 충돌이며, 등록하지 않고 먼저 해소한다.
#
# Created: 2026-08-11
# Supersedes: design/archive/dungeonking-2026-07/entities.yaml (base 600 · 12~16인 · 캐릭터 레벨 18 전제 — 무효)
#
# 규칙
#   source        이 값을 확정한 문서. 값을 바꾸려면 여기부터 고친다
#   referenced_by 이 값을 쓰는 문서들. 새 GDD가 참조하면 여기에 추가한다
#   derived_from  다른 등록값에서 계산된 파생값. 원천이 바뀌면 같이 바뀐다
#   status        active | deprecated
#
# ⚠️ 미정값은 등록하지 않는다. 파일 하단 `pending:` 섹션에 모아둔다.

constants:

  # ─── 이동 · 공간 ───────────────────────────────────────────

  - name: base_move_speed
    type: constant
    status: active
    value: 340
    unit: cm/s
    source: design/gdd/game-concept.md            # § 공간 "확정 수치 (2026-08-11)"
    referenced_by:
      - design/gdd/movement-camera.md             # 공식 1 base · Tuning Knobs
    note: >
      LoL 라이즈 기준값. 층 크기·세션 시간 예산이 전부 여기서 파생된다.
      movement-camera.md가 "사실상 고정값"으로 명시 — 바꾸면 § 공간 전체를 재계산해야 한다.

  - name: floor_size
    type: constant
    status: active
    value: "280 x 280"
    unit: m
    source: design/gdd/game-concept.md
    referenced_by:
      - design/art/art-bible.md                   # Section 6② MVP 무대
      - design/gdd/movement-camera.md
    note: 78,400 m². 소환사의 협곡(15,000×15,000 유닛) 대비 약 3.5배. 1 LoL 유닛 = 1 UE 유닛(cm) 고정.

  - name: players_per_floor
    type: constant
    status: active
    value: 30
    unit: players
    source: design/gdd/game-concept.md
    referenced_by:
      - design/art/art-bible.md
      - design/gdd/movement-camera.md
    note: 2026-08-11에 100 → 30 하향 확정. 4개 층 = 총 120 동접.

  - name: floor_count
    type: constant
    status: active
    value: 4
    unit: floors
    source: design/gdd/game-concept.md
    referenced_by:
      - design/art/art-bible.md
    note: MVP는 1층(평민 민가)만 구현. 2~4층은 Tier 3.

  - name: house_count_mvp
    type: constant
    status: active
    value: 3
    unit: houses
    source: design/gdd/game-concept.md
    referenced_by:
      - design/art/art-bible.md
    note: 모듈 재조합으로 제작.

  - name: house_count_final
    type: constant
    status: active
    value: 5
    unit: houses
    source: design/gdd/game-concept.md            # § 공간 "집 개수"
    referenced_by: []
    note: >
      30명 ÷ 6(집당 적정 교전 인원 5~8명)의 역산치.
      Open Questions에 남아 있던 "약 10개"는 100명 시절 잔재였고 2026-08-11에 정정됨.

  - name: floor_traversal_time
    type: constant
    status: active
    value: 82
    unit: seconds
    source: design/gdd/game-concept.md
    derived_from: [floor_size, base_move_speed]
    referenced_by: []
    note: 280 ÷ 3.4. 세션 시간 예산(§ Core Loop Session-Level)의 기초.

  - name: floor_diagonal_traversal_time
    type: constant
    status: active
    value: 116
    unit: seconds
    source: design/gdd/game-concept.md
    derived_from: [floor_size, base_move_speed]
    referenced_by: []

  - name: house_spacing
    type: constant
    status: active
    value: 125
    unit: m
    source: design/gdd/game-concept.md
    derived_from: [floor_size, house_count_final]
    referenced_by: []
    note: 280 ÷ √5. 집 간 이동 ≈ 37초(÷ 3.4 m/s)는 추가 파생치.

  - name: player_density_baseline
    type: constant
    status: active
    value: 2613
    unit: m² per player
    source: design/gdd/game-concept.md            # § 공간 "밀도 검증"
    derived_from: [floor_size, players_per_floor]
    referenced_by:
      - design/gdd/movement-camera.md
    note: 78,400 ÷ 30.

  # ─── 카메라 (movement-camera.md 소유) ──────────────────────

  - name: camera_target_arm_length
    type: constant
    status: active
    value: 2600
    unit: cm (UE units)
    source: design/gdd/movement-camera.md         # § Core Rule 8
    referenced_by:
      - design/gdd/game-concept.md
      - design/art/art-bible.md
    note: 화면 가로 30 m 역산. `bDoCollisionTest = false` 필수 — 켜두면 건물에 카메라가 당겨진다.

  - name: camera_fov
    type: constant
    status: active
    value: 60
    unit: degrees
    source: design/gdd/movement-camera.md
    referenced_by:
      - design/gdd/game-concept.md
    note: 좁은 FOV = 납작한 원근. 아트바이블 원칙 ①과 정합.

  - name: camera_pitch
    type: constant
    status: active
    value: -60
    unit: degrees (world absolute)
    source: design/gdd/movement-camera.md
    referenced_by:
      - design/gdd/game-concept.md                # Visual Identity Anchor — 근사 표기("약 −60°")
      - design/art/art-bible.md
    note: game-concept.md는 근사치로만 언급. movement-camera.md가 정확값의 소유자.

  - name: camera_visible_screen_area
    type: constant
    status: active
    value: 585
    unit: m² (화면 30 m × 19.5 m)
    source: design/gdd/movement-camera.md
    derived_from: [camera_target_arm_length, camera_fov, camera_pitch]
    referenced_by:
      - design/gdd/game-concept.md                # § 공간 밀도 검증 (2026-08-11 재계산 반영 완료)
    note: >
      동시 가시 인원 = 585 ÷ 2,613 ≈ 0.22명.
      이전 문서의 "1.9명"은 시야 반경 40 m라는 근거 없는 가정에서 나온 값이었고 폐기됨.

  - name: radar_radius
    type: constant
    status: active
    value: 22.5
    unit: m
    source: design/gdd/game-concept.md            # § 정보 · 탐지
    derived_from: [camera_visible_screen_area]
    referenced_by:
      - design/art/art-bible.md                   # Section 7 ⑦
    note: 화면 가로 절반(15 m) × 1.5. 감지 대상은 파티원 · 탈출 타워 · 루팅 가능 상자뿐 (적 · 몬스터 제외).

  # ─── 네트워크 ──────────────────────────────────────────────

  - name: move_packet_send_rate
    type: constant
    status: active
    value: 30
    unit: Hz
    source: design/gdd/movement-camera.md         # § Core Rule 10
    referenced_by:
      - docs/engine-reference/unreal/modules/networking.md
    note: >
      🔴 현재 코드는 `S1Player.h:48` `MOVE_PACKET_SEND_DELAY = 0.2f` (5 Hz) — 미반영.
      30 Hz 기준 대역폭: 클라 수신 278 kbps · 서버 업로드 8.4 Mbps · 초당 Send 26,100회.

  - name: remote_proxy_interp_duration
    type: constant
    status: active
    value: 66
    unit: ms
    source: design/gdd/movement-camera.md         # 공식 6a
    derived_from: [move_packet_send_rate]
    referenced_by: []
    note: >
      패킷 간격(33 ms)의 **2배**. 1배면 1 ms 지연에도 끊기고, 3배 이상이면 항상 뒤처진다.
      Source 엔진류 표준(interpolation delay = 1~2× update rate)과 일치.
      ⚠️ 전송 주기를 바꾸면 이 값도 같이 바꿔야 한다 — 독립 노브가 아니다.

  - name: teleport_threshold
    type: constant
    status: active
    value: 250
    unit: cm
    source: design/gdd/movement-camera.md         # 공식 6b
    referenced_by: []
    note: >
      `dash_speed_max(1360) × jitter_tolerance_window(150 ms)` = 204 cm, 여유 포함 250 cm.
      정상 대시는 틱당 45 cm에 불과해 절대 스냅되지 않는다.
      🔴 코드에 `TELEPORT_THERESHOLD = 250.0f` 하드코딩 존재 (`S1Player.h:50`) — 값은 일치하나 config 이전 필요.

  - name: move_budget_max_sec
    type: constant
    status: active
    value: 0.5
    unit: s
    source: design/gdd/movement-camera.md         # 공식 7a — 이동 예산 모델
    referenced_by:
      - design/gdd/movement-camera.md
    note: >
      이동 예산 상한 = `상한속도 × 0.5`. 340 기준 **170 cm**.
      **치팅 이득이 0인 이유**: 0.5초 정지 후 1.7m 순간이동이 가능하지만, 반복하면 평균
      `170cm ÷ 0.5s = 340 cm/s` 로 걸어간 것과 같다.
      🔴 **올리면** 순간이동 허용 거리가 비례해 늘고, **내리면** 도착 지터를 못 흡수해 오탐이 난다.
      실측 지터가 ±35%(27~59ms)이므로 0.25 미만으로 내리지 말 것.

  - name: server_validation_margin
    type: constant
    status: active
    value: 1.15
    source: design/gdd/movement-camera.md         # 공식 7a
    referenced_by: []
    note: >
      `Δ거리 ÷ Δ시간 ≤ effective_move_speed(player) × 1.15`.
      🔴 **전역 상수 340을 쓰면 안 된다** — 이속 장비를 낀 플레이어(최대 510)가 정상 이동으로 오탐 차단된다.
      Δ시간은 서버 수신 타임스탬프 실측차를 쓴다 (1/30 고정 가정 금지).
      ✅ **음성 테스트 검증 (2026-08-11)**: `MaxWalkSpeed` 340→2000(5.88배 핵) 조작 시
      동일 구간 통과 시간 22.71s → 19.46s. **실측 이득 1.167× · 예측 1.15×** — 오차 범위 일치.
      잠재 이득(5.88×)의 83% 차단.
      🔴 **남은 15%는 이 상수 자체다.** 최상급 이속 아이템 1개(`percent_ms_bonus_i` 0.15)와 동등하므로
      무시할 수준이 아니다. 예산 모델이 지터를 흡수하므로 **1.05까지 낮출 여지**가 있으나
      로컬 지터 ≠ 인터넷 지터다. **원격 실측 전까지 1.15 유지.** 재검토: SV-2 16인 단계(P3).

  # ─── 세션 · 손실 ───────────────────────────────────────────

  - name: session_length
    type: constant
    status: active
    value: 1800
    unit: seconds
    source: design/gdd/game-concept.md
    referenced_by: []
    note: 30분 개인별 체류 타이머. 만료 시 자동 사망 + **전량 소멸**(가방 드랍 없음).

  - name: escape_gauge_duration
    type: constant
    status: active
    value: 60
    unit: seconds
    source: design/gdd/game-concept.md
    referenced_by: []
    note: 인원 무관 고정. 구역 이탈 시 역행, 1명이라도 남으면 계속 충전, 완충 시 구역 전원 탈출.

  - name: spawn_invulnerability_duration
    type: constant
    status: active
    value: 3
    unit: seconds
    source: design/gdd/game-concept.md            # § 스폰 보호
    referenced_by:
      - design/gdd/movement-camera.md
    note: 진입 직후. **이동 또는 공격 시 즉시 해제.** 소유는 전투 시스템 — 이동은 관여하지 않는다.

  - name: loot_bag_lifetime
    type: constant
    status: active
    value: 10
    unit: minutes
    source: design/gdd/game-concept.md
    referenced_by: []
    note: >
      **PvP · 몬스터 사망 시에만** 적용. 타이머 만료 사망은 가방 자체가 생성되지 않는다.
      두 죽음이 서로 다른 목표를 담당한다 — PvP = 회수 판타지, 타이머 = 확정적 인플레 싱크.

  - name: gold_retention_on_death
    type: constant
    status: active
    value:
      keep_pct: 30
      lost_pct: 70
    unit: percent
    source: design/gdd/game-concept.md
    referenced_by: []
    note: >
      **P5의 유일한 예외** — 골드는 사망해도 30%가 항상 유지된다. 없으면 빈털터리에서 회복 경로가 막힌다.
      나머지 70%의 운명은 사망 종류에 따라 다르다: PvP = 가방 드랍(루팅 가능) / 타이머 만료 = 소멸.

  - name: equipment_slots
    type: constant
    status: active
    value:
      count: 5
      list: [무기, 투구, 갑옷, 신발, 장신구]
      key_mapping:
        무기:   [Shift, Q]      # 2키 — 하드 CC는 이 부위 전용
        투구:   [E]
        갑옷:   [R]
        신발:   [Z]
        장신구: [X]
    source: 2026-08-11 결정 (사용자)
    referenced_by:
      - design/gdd/game-concept.md
      - production/roadmap.md              # P1.5 결속 슬롯 수
    note: >
      **무기가 2키를 갖는다.** 익스트랙션에서 가장 값나가는 전리품이 무기이므로,
      무기 하나를 바꾸면 스킬 2개가 동시에 바뀌어 "들고 나갈까"의 갈등(P5)이 무거워진다.
      하드 CC는 무기 부위 전용이라는 규칙과도 부합한다.

  - name: warehouse_capacity
    type: constant
    status: active
    value: 25
    unit: slots
    derived_from: [equipment_slots]
    source: design/gdd/game-concept.md
    referenced_by:
      - design/gdd/item-equipment-system.md     # C6 출정 선택 — MVP 최소판 `Vaulted` 상한
    note: >
      부위 5개 × 5 = 25칸. 예비 세트 약 5벌이 의도된 천장.
      ✅ **2026-09-03**: 창고 완전판은 T3 지만, `item-equipment-system.md` C6 **출정 선택**이 같은 25 를
      MVP 의 베이스캠프 보관 상한으로 쓴다(관리 UI·골드·경제 없음). 상한 없이 두면 P5 와
      인구 순환 브레이크가 MVP 에서 깨진다.

  - name: warehouse_capacity_formula
    type: constant
    status: active
    value: "equipment_slot_count * 5"
    unit: slots
    source: design/gdd/game-concept.md            # § 성장 · 손실 #창고
    referenced_by: []
    note: >
      부위 무관 — 무기만 채워도 된다. 예비 세트 약 5벌이 의도된 천장.
      **인구 순환의 실질적 브레이크**다. 상한이 없으면 예비 만렙 세트를 무한 축적해 티어 강등이 영구 상쇄된다.
      ✅ **확정: 5부위 × 5 = 25칸** (2026-08-11). `equipment_slots` 참조.

  # ─── 접근 · 사회 ───────────────────────────────────────────

  - name: floor_tier_access
    type: constant
    status: active
    value:
      floor1: "모든 유저"
      floor2: "2티어 이상"
      floor3: "3티어 이상"
      floor4: "4티어만"
    source: design/gdd/game-concept.md
    referenced_by: []
    note: 게이팅은 "자기 티어 이하는 자유, 초과는 차단". 티어 판정 = 착용 아이템 레벨 총합.

  - name: tier_gap_party_size_limit
    type: constant
    status: active
    value:
      tier4_floor1: 0     # 추가 파티원 수 (본인 제외)
      tier4_floor2: 1
      tier4_floor3: 2
      tier4_floor4: 3
    source: design/gdd/game-concept.md
    referenced_by: []
    note: >
      "파티 내 최고 티어 기준, 입장 시 1회 검사."
      ⚠️ **4티어 예시 하나만 명시돼 있다.** 타 티어 조합의 일반화 공식은 미정 — pending 참조.

  - name: reference_resolution
    type: constant
    status: active
    value: "1920 x 1080"
    source: 2026-08-11 결정 (사용자)
    referenced_by:
      - design/gdd/movement-camera.md              # AC-30
    note: Steam 하드웨어 설문 1위. 아트바이블 VRAM 예산(4 GB)도 1080p 기준으로 산정됨.

  - name: validation_skip_semantics
    type: constant
    status: active
    value: "position_updated_speed_check_skipped"
    source: 2026-08-11 결정 (사용자)
    referenced_by:
      - design/gdd/movement-camera.md              # 공식 7a · AC-23
    note: >
      `Δt < 16.6 ms` 패킷은 **위치는 갱신하되 속도 검사만 생략**한다.
      폐기하면 프레임이 튄 정상 유저의 이동이 버려져 끊겨 보인다.
      건너뛰어도 다음 정상 간격 패킷에서 **누적 거리로 잡힌다.**

  # ─── 시각 (art-bible 소유) ─────────────────────────────────

  - name: gameplay_three_colors
    type: constant
    status: active
    value:
      ally: "#3987E5"
      enemy_player: "#D95926"
      monster: "#199E70"
    source: design/art/art-bible.md               # Section 4 ①
    referenced_by:
      - design/gdd/game-concept.md
    note: >
      색맹 검증 통과 (ΔE 9.4 최악 / 20.9 정상).
      **목숨이 걸린 정보이므로 다른 용도로 절대 재사용 금지** — art-bible 자체 명시.

  # ─── 성능 예산 (technical-preferences 소유) ────────────────

  - name: draw_call_budget
    type: constant
    status: active
    value: 3000
    unit: draw calls / frame
    source: .claude/docs/technical-preferences.md   # GDD 아님 — 프로젝트 설정 문서
    referenced_by:
      - design/art/art-bible.md                     # §8 ⑤ "예산 3000의 약 14%"
    note: 두 문서가 이미 동일 수치를 공유 중. 등록해 드리프트를 막는다.

  - name: client_memory_budget
    type: constant
    status: active
    value:
      ram_gb: 6
      vram_gb: 4
    source: .claude/docs/technical-preferences.md
