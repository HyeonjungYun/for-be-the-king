  - name: full_gear_effective_hp_cap
    type: constant
    status: active
    value: 2.0
    unit: 배율
    source: design/gdd/game-concept.md          # § 장비 스케일 상한
    referenced_by:
      - design/gdd/game-concept.md
      - design/gdd/combat-system.md
    note: >
      **풀장비 실효HP 배율 상한.** 2026-08-14 확정. 맨몸 대비 최대 2배.
      `실효HP배율 = HP배율 × 완화계수`, `완화계수 = (armor + K_mitigation) / K_mitigation`
      예: `HP 1.4배 × armor 40` = 1.96 · `HP 1.0 × armor 100` = 2.0 · `HP 2.0 × armor 0` = 2.0
      부위별 배분은 아이템 설계 몫이며, **곱이 2.0 을 넘지 않게** 한다.
      → 30초 교전을 만족하는 **필요 DPS 배율 = 3.33** (`full_gear_dps_cap`)

      **왜 2배인가 — 이 숫자가 맨몸 ↔ 풀장비 격차를 결정한다**

      | | 시간 |
      | ---- | ---- |
      | 맨몸 → 풀장비 킬 | 100초 |
      | 풀장비 → 맨몸 킬 | 15초 |
      | 격차 | **6.7배** |

      익스트랙션에서 맨몸은 "다 잃고 재시작한 상태"다. 격차가 크면 재기가 불가능해
      파산 유저가 이탈하고, 작으면 장비를 모을 이유가 약해진다. 2배는
      **매복·기습·다구대일로 뒤집을 여지를 남기는** 쪽을 택한 값이다.
      🔴 3배(격차 15배)·4배(27배)를 검토했고 의도적으로 기각했다. 올리려면 이 표를 다시 볼 것.

