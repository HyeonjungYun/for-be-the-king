      하드 CC 는 무기 부위 1개 + 쿨다운이므로 그 이상 겹칠 수 없다.
      🔴 **동시에 던지면 겹쳐서 낭비된다(4인 동시 → 약 1.55초).** 이것은 버그가 아니라 의도다 —
      **실력 표현 축 2순위(쿨다운 시퀀싱)** 가 여기서 작동한다. 순서를 맞출 줄 아는 팀만 5초를 얻는다.

