      상한을 350 이상으로 올리면 `knockback_duration` 이 0.4s 를 넘어
      **이동 검증 예외창(movement-camera 공식 7b) 규약을 위반**한다.

  - name: knockback_speed
    type: constant
    status: active
    value: 800
    range: [450, 1360]
    unit: cm/s
    source: design/gdd/skill-system.md            # S2
    referenced_by:
      - design/gdd/skill-system.md
      - design/gdd/combat-system.md
    note: >
      `dash_kinematics.dash_speed` 와 **같은 범위**를 쓴다. 이동 검증 예외창을 그대로
      재사용하기 위해서다. 상한 1360 을 넘기려면 **서버 협의 필요**.

  - name: soft_cc_duration_max
    type: constant
    status: active
    value:
      slow:    3.0   # s
      silence: 1.5
    unit: s
    source: design/gdd/skill-system.md            # R2
    referenced_by:
      - design/gdd/skill-system.md
    note: >
      **감속 3.0s**: 더 길면 사실상 영구 감속이 되어 **기동 축이 무의미**해진다.
      3초는 교전 한 국면이다.
      **침묵 1.5s**: 하드 CC(1.25)보다 약간 길다 — 평타는 되기 때문. 더 길면
      **스킬 의존 빌드만 골라 죽이는 하드 카운터**가 된다.

  - name: instant_burst_cap
    type: constant
    status: active
    value:
      burst_cap_ratio: 0.35
      instant_ratio_sum_max: 10.0
    source: design/gdd/skill-system.md            # S5
    referenced_by:
      - design/gdd/skill-system.md
    note: >
      **GCD 가 없는 대가.** 즉발기(`cast_ms` = 0)만 모으면 순간 폭딜이 가능하므로,
      한 로드아웃의 **즉발기 계수 합 ≤ 10.0** 으로 제한한다. 런타임 검사가 아니라
      **콘텐츠 설계 단계 검사**다.
      🔴 **검사는 완화 전(pre-mitigation) 버스트를 effective HP 와 비교한다** —
      `attack_power(10×full_gear_dps_cap 3.33) ÷ effective_max_hp(500×full_gear_effective_hp_cap 2.0)`.
      맨몸 기준(≤17.5)으로 통과해도 풀장비(≤10.5)에서 깨진다.
      계수 상한 3.0 과 맞물려 **즉발기는 실질 3개까지**다. 이것이 계수 상한 3.0 의 근거다.
      2026-08-20 /consistency-check 로 잘못된 유도(DPS×HP≤2.0)를 발견해 정정 — 결론값(≤10.5)은 그대로다.

formulas:

  - name: cc_effective_duration
    type: formula
    status: active
    source: design/gdd/game-concept.md            # § CC 체계 — 실효 CC 시간
    referenced_by:
      - design/gdd/skill-system.md
      - design/gdd/game-concept.md
      - design/gdd/movement-camera.md             # can_move / can_turn 플래그의 지속시간 공급원
    expression: "cc_base_duration * (1 - resistance * resistance_max_reduction)"
    variables:
      - { name: cc_base_duration,        range: [0, 1.75], unit: s, note: "✅ 2026-08-20 확정 — hard_cc_base_duration 참조. 유형별 상한: 기절 1.25 · 공중 1.0 · 속박 1.75" }
      - { name: resistance,              range: [0, 1.0], note: "장비로 상승. 기본 0. 보스형 몬스터는 등급별 고정" }
      - { name: resistance_max_reduction, value: 0.4 }
    output_range: ["0.6 × base", "1.0 × base"]
    unit: s
    note: >
      **선형 + 상수 상한.** 이전 초안 `1 − 저항력`은 저항력 1.0에서 완전 면역이라 P1과 충돌했다.
      경감 계수 0.4를 곱해 상한을 40%로 묶었고, **최대치여도 60%는 반드시 걸린다.**
      아카이브 데미지 완화 `armor/(armor+K)`가 점근 곡선으로 "완전 무적 불가"를 달성한 것과
      같은 의도를 더 단순한 형태로 만족한다.
      예: 1초 CC → 저항 0에서 1.00초 · 저항 0.5에서 0.80초 · 저항 1.0에서 0.60초.
      🔴 **CC 소유는 전투 시스템.** 이동 시스템은 결과 플래그(`can_move`/`can_turn`)만 읽는다.

  - name: effective_move_speed
    type: formula
    status: active
    source: design/gdd/movement-camera.md         # 공식 1 — ⭐ 크로스시스템
    referenced_by:
      - design/gdd/skill-system.md
      - design/gdd/movement-camera.md
    expression: "clamp((base_move_speed + flat_ms_bonus) * (1 + sum(percent_ms_bonus_i)) * (1 - active_slow), ms_min_ratio * base, ms_max_ratio * base)"
    variables:
      - { name: base_move_speed,    value: 340,        unit: cm/s }
      - { name: flat_ms_bonus,      range: [0, 85],    unit: cm/s }
      - { name: percent_ms_bonus_i, range: [0, 0.15],  note: 아이템당. 가산 스택 }
      - { name: active_slow,        range: [0, 0.40],  note: "소프트 CC. max(slow_i) — 합산 아님. 🔴 별도 곱셈항" }
      - { name: ms_min_ratio,       value: 0.5 }
      - { name: ms_max_ratio,       value: 1.5 }
    output_range: [170, 510]        # 하드 클램프. 실사용 범위는 [204, 510]
    unit: cm/s
    note: >
      **가산 후 1회 곱** — 곱연산이면 아이템 5개 × +20%가 1.2^5 ≈ 2.49배로 폭주해 무한 카이팅을 유발한다.
      `flat_ms_bonus` 상한 85는 base 600 시절의 150(=25%)을 340 기준 25%로 재계산한 값.
      🔴 **서버 이동 검증(공식 7)이 이 값을 플레이어별로 계산해야 한다.** 전역 상수 340을 쓰면 오탐 차단.
      🔴 **`active_slow`는 반드시 별도 곱셈항이다** (2026-08-11 신설). `(1 + Σpct − slow)`로 가산에
      섞으면 속도 장비를 낀 플레이어가 감속에 면역처럼 작동한다 —
      맨몸 340→204인데 속도템 510은 `340×(1+0.5−0.4)=374`로 **감속 전 base보다 빨라진다.**
      장비 · 스킬 GDD 작성 시 보너스 공급원으로서 referenced_by에 자신을 추가할 것.

  - name: dash_kinematics
    type: formula
    status: active
    source: design/gdd/movement-camera.md         # 공식 3 — ⭐ 크로스시스템 (스킬이 참조)
    referenced_by:
      - design/gdd/skill-system.md
      - design/gdd/movement-camera.md
    expression: "dash_duration = dash_dist / dash_speed ; dash_pos(t) = start + normalize(dash_dir) * dash_speed * t"
    variables:
      - { name: dash_dist,     range: [200, 800],   unit: cm,   note: 공간값 — base 무관. 아카이브 값 유지 }
      - { name: dash_speed,    range: [450, 1360],  unit: cm/s, note: base 상대 개념 — 1.33x~4x 비율 유지 }
      - { name: dash_duration, range: [0.15, 0.4],  unit: s,    note: **실제 제약은 이 값** }
    note: >
      ⚠️ (dist, speed)는 자유 조합이 아니다. 항상 duration이 0.15~0.4 s 안에 들어와야 한다.
      `dash_speed` 상한 1,360은 서버 검증 예외 윈도우(공식 7b)의 상한과 연동된다 — 넘기려면 서버 협의 필요.
      🔴 **스킬 시스템은 대시 실행 *전에* 서버에 캐스트를 통지해야 한다.** 안 하면 서버가 대시를 거부한다.


  - name: skill_damage
    type: formula
    status: active
    source: design/gdd/skill-system.md            # S3
    referenced_by:
      - design/gdd/skill-system.md
    expression: "C1(attack_power * ad_ratio, PHYSICAL) + C1(magic_power * ap_ratio, MAGIC)"
    variables:
      - { name: attack_power, note: "맨몸 10. 장비 공급. base_stats_naked 와 동일 스탯. Server/GameServer/Creature.h:7 BaseStats::ATTACK_POWER 와 이름 일치 (2026-08-20 재정정 — 서버가 이미 attack_power 로 구현되어 있어 이쪽이 정답)" }
      - { name: magic_power,  note: "맨몸 0. 장비 공급 — 마법 빌드는 장비 없이 성립하지 않는다" }
      - { name: ad_ratio, range: [0, 3.0], note: "스킬 고유 고정값. 아이템 레벨과 무관" }
      - { name: ap_ratio, range: [0, 3.0], note: "위와 같음" }
    note: >
      **물리 항은 armor, 마법 항은 magic_resist 로 각각 완화**한다. C1 을 두 번 적용하고
      합산은 완화 이후다. 크리(C2)는 완화 전 각 항에 적용된다.
      🔴 **아이템 레벨은 계수가 아니라 스탯(attack_power·magic_power)을 올린다.**
      둘 다 올리면 skill_power ∝ 레벨² 이 되어 장비 스케일 상한(DPS 3.33×)을 뚫는다.
      그래도 "강화한 부위의 스킬이 강해진다"는 성립한다 — 무기를 강화하면 attack_power 가
      오르고 **ad_ratio 가 높은 스킬이 더 크게 이득**을 본다. 계수는 스킬의 정체성,
      강화는 스탯, **둘의 곱이 빌드 시너지**다.
      별도 `skill_base_power` 배율은 두지 않는다 — 계수와 항상 곱해지므로 중복이다.

items:

  - name: item_rarity_tiers
    type: item
    status: active
    value:
      common:    { color: "#9AA0A6", shape: "직사각" }
      rare:      { color: "#199E70", shape: "모서리 깎임" }
      epic:      { color: "#3987E5", shape: "육각",  fx: "미세 발광" }
      legendary: { color: "#E66767", shape: "별형",  fx: "발광 + 파티클" }
    source: design/art/art-bible.md               # Section 4 ②
    referenced_by:
      - design/gdd/game-concept.md
      - design/gdd/item-equipment-system.md       # § Visual — 고유 아이템 개별 아트 위에도 그대로 얹는다
    note: >
      🔴 **색만으로는 구분 불가** (색맹 ΔE 6.5, WARN 구간) → **형태 이중부호화 필수.**
      색만 쓰는 UI · 문서 작성 금지.
      **공식 등급명은 일반 · 희귀 · 영웅 · 전설 뿐이다.** "매우 희귀" 같은 서술적 표현을 쓰면
      드랍 테이블에서 등급 오해가 생긴다 (2026-08-11 game-concept.md § 공간을 공식 명칭으로 정렬함).
      ⚠️ **2026-09-03 사용자 결정**: 영웅·전설 고유 아이템은 **전부 개별 아트**다. art-bible § 4 ②의
      "전설 히어로 아이템 몇 개"라는 전제가 깨지므로 § 8 예산 재검증 필요 (pending `unique_item_art_budget`).

  - name: item_grade_model
    type: item
    status: active
    value:
      generic:  { grade_mode: rolled, grades: [common, rare] }        # 범용 종류 — 드랍 시 추첨
      unique:   { grade_mode: fixed,  grades: [epic, legendary] }     # 고유 종류 — 종류에 고정, 개별 서사
      unique_base_stat_rule: "unique.base_stat <= generic.base_stat (같은 부위·아키타입, 스탯별)"
      unique_skill_roll: "equipment-skill-binding B3 추첨 그대로"
      unique_concurrency_limit: none                                  # worldbuilding § 4.3 "사본"
      story_artifacts_excluded: ["호모라의 검", "니라의 익힘책", "선대의 책"]   # 드랍 파이프라인 밖
    source: design/gdd/item-equipment-system.md   # § C5 (2026-09-03 사용자 결정 D1)
    referenced_by:
      - design/gdd/item-equipment-system.md
      - design/gdd/equipment-skill-binding.md     # B3 — 고유 종류도 추첨
    note: >
      **등급의 두 층.** 범용 종류는 영웅·전설로 절대 떨어지지 않고, 영웅·전설은 각각 이름 있는
      고유 종류다. 서사는 툴팁이 아니라 던전 기록물에 있다(D2) — 종류가 `lore_record_ids[]` 로 내부 참조.
      🔴 **고유 `base_stat` ≤ 범용 `base_stat`** 규칙이 D4 상한 검증을 고유 50~60종에 자동 전이시킨다.
      명명·공개 가드레일(실명 금지 · 층별 허용 범위 · 마법 유물 10년 이내)은 GDD § C5-a.

  - name: grade_multiplier
    type: formula
    status: active
    value:
      common:    1.0
      rare:      1.3
      epic:      1.7
      legendary: 2.2
    source: design/gdd/item-equipment-system.md   # § D1
    referenced_by:
      - design/gdd/item-equipment-system.md
    note: >
      **아이템 등급이 `base_stat` 에 곱해지는 계수.** 드랍 시 확정되고 영구 불변이다.

      🔴 **이 표의 간격이 "운 대 노력"의 다이얼이다.** 풀장비 상한(HP 2.0 / DPS 3.33)이
      꼭대기를 고정하므로, 배율을 키우면 최강 장비가 세지는 게 아니라 **최약 장비가
      상대적으로 약해진다.** 가파르게 하면 파밍 운이, 완만하게 하면 강화 노력이 지배한다.

      현행 값이 만드는 성질: **만렙 일반템 = 갓 나온 전설템** (정확히 동률).

      ✅ **2026-09-03 등급 모델 두 층** (`item_grade_model` 참조): 1.0/1.3 은 범용 종류가 드랍 시 굴리고,
      **1.7/2.2 는 고유 종류(영웅·전설)로만 도달**한다. "만렙 일반 = 전설 0" 동률은 이제 공식 성질이
      아니라 데이터 제약(고유 `base_stat` ≤ 범용 `base_stat`)에서 오며, 실제 비교 기준점은
      **만렙 희귀(×2.5) 대 전설 0(×2.2)** 다.
      🔴 **`GM_전설` 을 안전범위(1.6~2.6) 안에서 바꿔도 `base_stat` 을 재유도하고 D4 를 다시 돌려야 한다.**
      2.6 에서 재유도 없이는 DPS 상한을 넘는다 (/design-review 2026-09-03, systems-designer).

  - name: item_level_max
    type: constant
    status: active
    value: 16
    source: design/gdd/item-equipment-system.md   # § D2
    referenced_by:
      - design/gdd/item-equipment-system.md
    note: >
      **아이템 강화 최대 레벨.** 안전 범위 10~25.

      🔴 **이 값을 바꾸면 `per_level_rate` 가 자동으로 따라 움직여야 한다** —
      `per_level_rate = base_stat × (GM_전설 − GM_일반) / item_level_max`.
      따로 조절하면 "만렙 일반템 = 전설 0레벨" 동률이 깨진다.

  - name: item_level_reset_on_forced_transfer
    type: constant
    status: active
    value: 0
    source: design/gdd/item-equipment-system.md   # § C4
    referenced_by:
      - design/gdd/item-equipment-system.md
      - design/narrative/worldbuilding.md
    note: >
      **강제 소유권 이전 시 아이템 레벨이 떨어지는 값 = 0 (전량 초기화).**
      새 주인도 이 값에서 시작한다. 등급은 초기화되지 않는다.

      **초기화되는 경우**: PvP·몬스터 사망으로 가방 드랍 → 타인이 루팅
      **초기화되지 않는 경우**: 착용 해제 · 인벤 보관 · 창고 보관 · 탈출 성공

      세계관 근거: 기물은 주인의 마력이 스며든 정도를 레벨로 갖는다.
      주인을 잃는 순간 마력을 놓는다 (`worldbuilding.md` § 11.2).
      **타이머 만료 사망은 해당 없다** — 전량 소멸이라 드랍 자체가 없다.

  - name: enhancement_material_cost
    type: formula
    status: active
    value: "ceil(11 × 1.20^L)"
    tier: T3                                       # 강화는 Tier 3 — roadmap § P2 "강화 제외"
    source: design/gdd/item-equipment-system.md   # § D5
    referenced_by:
      - design/gdd/item-equipment-system.md
    note: >
      **강화 비용 (마력정 개수).** `L` 은 **현재 레벨**이며 `L → L+1` 강화에 드는 값이다.
      🔴 지수는 `L` 이지 `L+1` 이 아니다. **정수화는 올림(ceil)** — 2026-09-03 확정. 마력정에 파편이 없다.

      변수: `base_cost` = 11 (🔴 잠정, 5~20) · `growth_rate` = 1.20 (🔴 잠정, 1.15~1.30)
      총비용 0→16 = Σ ceil(11 × 1.20^L) = **970개** (연속식 962 + 올림분 8). 마지막 4레벨이 전체의 54.5%.
      ⚠️ 안전범위 양끝에서 총비용이 279~4,369 개로 진동하고 상단은 스택 99 × 창고 25 = 2,475 를 넘는다.

      🔴 **페이싱은 사망률의 함수다** (/design-review 2026-09-03, economy-designer). 초안의 "~31런"은
      "31런 연속 무사망"이며 런당 사망률 10% 면 기대 281런. 창고가 레벨을 보존하므로 플레이어가 이
      함수를 회피할 수 있다(좋은 것은 강화만 하고 안 들고 나간다) — 구조 문제. **창고·티어 게이팅과
      동시에 설계**하며, 이 잠정값을 목표로 Q4 를 튜닝하지 않는다.

      **등급은 비용에 영향이 없다.** 레벨당 스탯 성장이 등급 무관이므로 비용도 무관해야
      대칭이 맞는다 — 아니면 등급 운이 진행 속도까지 지배한다.

      **실패·파괴 확률 없음.** 죽으면 이미 전량 초기화되므로 두 번째 손실 장치는 중복이고,
      이 게임엔 캐릭터 레벨이라는 완충재가 없다.

  - name: dungeon_inventory_slots
    type: constant
    status: active
    value: 25
    source: design/gdd/item-equipment-system.md   # § Core Rules
    referenced_by:
      - design/gdd/item-equipment-system.md
    note: >
      **던전 반입 인벤토리 용량.** 창고(25슬롯)와 같은 값이며 **부위 무관**이다.
      사망 시 이 25슬롯 + 착용 5부위 = 최대 30개가 가방으로 전이한다.

      ⚠️ **`game-concept.md` 의 "무게·소지한도 시스템은 없다"는 이동속도 페널티 같은
      무게 계산이 없다는 뜻으로 좁혀 해석한다.** 25슬롯은 무게가 아니라 개수 상한이다.

  - name: enhancement_material
    type: item
    status: active
    tier: T3                                       # 2026-09-03 사용자 결정 — MVP 에서 드랍하지 않는다
    value:
      name_placeholder: 마력정
      stack_limit: 99
      occupies_slot: true
      lost_on_death: true
      mvp_drop: false
    source: design/gdd/item-equipment-system.md   # § D5 · D6
    referenced_by:
      - design/gdd/item-equipment-system.md
    note: >
      **강화 재화. 인벤토리 슬롯을 차지하는 소모성 아이템**이며 일반 아이템과 같은
      전손 규칙을 따른다 (골드처럼 30% 보호되지 않는다).

      아이템 형태를 택한 이유: 골드의 유일한 파세트(`guild_buyback_rules`)가 미설계라
      골드 기반 강화는 미결 항목에 묶인다. 드랍 → 강화의 자기완결 루프가 필요했다.
      또 "골드는 P5의 유일한 예외"라는 문장을 그대로 살린다.

      🔴 **스택이 필수다.** 962개(1아이템 만렙분)가 25슬롯에 들어가려면 스택이 있어야 한다.
      스택 상한 99는 잠정값 (50~999).
      🔴 이름 "마력정"은 자리표시자다 — 서사 확정 필요.

