pending:

  - name: equipment_slot_count
    owner: systems-designer
    blocks: [warehouse_capacity_formula]
    urgency: 최우선
    note: 창고 용량(부위 × 5)이 여기 종속. 여러 시스템이 대기 중.

  - name: cc_resistance_cap
    owner: systems-designer
    urgency: 전투 GDD 작성 전
    note: >
