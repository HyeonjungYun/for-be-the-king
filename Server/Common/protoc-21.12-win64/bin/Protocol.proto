syntax = "proto3";
package Protocol;

import "Enum.proto";
import "Struct.proto";


message C_LOGIN
{
	string token = 1;
}

message S_LOGIN
{
	bool success = 1;
	repeated CharacterInfo characters = 2;
}

message C_ENTER_GAME
{
	uint64 playerIndex = 1;
	uint32 floor_id = 2;
	uint32 entry_point_id = 3;
}

message S_ENTER_GAME
{
	bool success = 1;
	ObjectInfo player = 2;
	uint32 run_remaining_ms = 3;	// stay timer left, also on reattach. 0 = unknown (escape-timer.md Core Rule 15)
}

message C_LEAVE_GAME
{

}

message S_LEAVE_GAME
{
	RunEndReason reason = 1;		// escaped / expired - for the result notice
	uint64 gold_kept = 2;			// gold credited to the account (escape 100 %, expiry 30 %)
	uint32 items_destroyed = 3;		// items destroyed by expiry
}

message S_SPAWN
{
	repeated ObjectInfo players = 1;
}

message S_DESPAWN
{
	repeated uint64 object_ids = 1;
}

message C_MOVE
{
	PosInfo info = 1;
	uint64 client_ms = 2;
}

message S_MOVE
{
	repeated PosInfo infos = 1;
	bool correction = 2;
}

message C_ATTACK
{
	uint64 target_id = 1;
}

message S_ATTACK
{
	repeated AttackInfo attacks = 1;
}

message S_ATTACK_CANCEL
{
	repeated uint64 attacker_ids = 1;
}

message S_DAMAGE
{
	repeated DamageInfo damages = 1;
}

message S_CC
{
	repeated CcEventInfo applied = 1;
	repeated CcEventInfo expired = 2;
	repeated KnockbackInfo knockbacks = 3;
}

message S_CC_STATE
{
	repeated CcStateInfo states = 1;
}

message S_DIED
{
	repeated DiedInfo deaths = 1;
}

message C_CHAT
{
	string msg = 1;
}

message S_CHAT
{
	uint64 playerId = 1;
	string msg = 2;
}

message C_SKILL
{
	EquipSlot slot = 1;
	uint64 target_id = 2;
	float aim_x = 3;
	float aim_y = 4;
}

message C_SKILL_CANCEL
{
}

message S_SKILL_CAST
{
	repeated SkillCastInfo casts = 1;
}

message S_SKILL_CANCEL
{
	repeated uint64 caster_ids = 1;
}

message S_SKILL_HIT
{
	repeated SkillHitInfo hits = 1;
}

message S_EQUIP_SYNC
{
	repeated SkillInfo skills = 1;
}

message C_GRANT_REWARD
{
	string request_id = 1;
	uint64 character_id = 2;
	uint64 gold = 3;
	string reason = 4;
}

message S_GRANT_REWARD
{
	string request_id = 1;
	uint32 result = 2;
	uint64 gold_after = 3;
}

message C_EQUIP
{
	string request_id = 1;
	uint64 instance_id = 2;
	EquipSlot slot = 3;
}

message C_UNEQUIP
{
	string request_id = 1;
	uint64 instance_id = 2;
}

message C_LOOT
{
	string request_id = 1;
	uint64 bag_id = 2;
	uint64 instance_id = 3;
}

message C_DROP
{
	string request_id = 1;
	uint64 instance_id = 2;
}

message S_ITEM_RESULT
{
	string request_id = 1;
	ItemResult result = 2;
	repeated ItemInstance changed = 3;
}

message C_STASH
{
	string request_id = 1;
	uint64 instance_id = 2;
	bool to_vault = 3;
}

message S_INVENTORY_SYNC
{
	repeated ItemInstance items= 1;
}

message S_BAG_CONTENTS
{
	uint64 bag_id = 1;
	repeated ItemInstance items = 2;
	uint64 remaining_ms = 3;
}

message C_BAG_OPEN
{
	uint64 bag_id = 1;
}

// New messages go at the end only - packet ids follow declaration order (ADR-0005)

// Escape tower gauge and alert (escape-timer.md Core Rule 10-12)
message S_ESCAPE_GAUGE
{
	uint32 tower_id = 1;				// 0 = alert only (position hidden). 1.. = tower on the floor (Ta=1, Tb=2, Tc=3)
	EscapeGaugeState state = 2;
	uint32 progress_permille = 3;		// 0..1000, 0 for alert only
	float rate_per_s = 4;				// progress per second (+1/60, -2/60, 0) - the client extrapolates
	bool self_in_zone = 5;				// the receiver is in the zone now
}

// Chest looted state (radar.md OQ-1) - radar and chest look know Sealed / Looted
message S_CHEST_STATE
{
	repeated uint64 looted_ids = 1;		// looted chest object ids (CHEST_ID_BASE + chest_id)
	bool snapshot = 2;					// true: the full list (absent = Sealed), false: just looted
}
