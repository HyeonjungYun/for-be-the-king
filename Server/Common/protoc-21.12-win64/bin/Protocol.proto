syntax = "proto3";
package Protocol;

import "Enum.proto";
import "Struct.proto";


message C_LOGIN
{
	string token = 1;
}

message S_LOGIN
{
	bool success = 1;
	repeated CharacterInfo characters = 2;
}

message C_ENTER_GAME
{
	uint64 playerIndex = 1;
	uint32 floor_id = 2;
	uint32 entry_point_id = 3;
	RunMode mode = 4;				// PVP = the shared floor (default). PVE solo / co-op = a private instance (ADR-0014)
}

message S_ENTER_GAME
{
	bool success = 1;
	ObjectInfo player = 2;
	uint32 run_remaining_ms = 3;	// stay timer left, also on reattach. 0 = unknown (escape-timer.md Core Rule 15)
	RunMode mode = 4;				// the mode of the room I am in - also on reattach
}

message C_LEAVE_GAME
{

}

message S_LEAVE_GAME
{
	RunEndReason reason = 1;		// escaped / expired - for the result notice
	uint64 gold_kept = 2;			// gold credited to the account (escape 100 %, expiry 30 %)
	uint32 items_destroyed = 3;		// items destroyed by expiry
}

message S_SPAWN
{
	repeated ObjectInfo players = 1;
}

message S_DESPAWN
{
	repeated uint64 object_ids = 1;
}

message C_MOVE
{
	PosInfo info = 1;
	uint64 client_ms = 2;
}

message S_MOVE
{
	repeated PosInfo infos = 1;
	bool correction = 2;
}

message C_ATTACK
{
	uint64 target_id = 1;
	float aim_x = 2;		// cursor point on the ground - non-target basics (sword dash slash 1119, dagger spin 1120). 0,0 = none
	float aim_y = 3;
}

message S_ATTACK
{
	repeated AttackInfo attacks = 1;
}

message S_ATTACK_CANCEL
{
	repeated uint64 attacker_ids = 1;
}

message S_DAMAGE
{
	repeated DamageInfo damages = 1;
}

message S_CC
{
	repeated CcEventInfo applied = 1;
	repeated CcEventInfo expired = 2;
	repeated KnockbackInfo knockbacks = 3;
}

message S_CC_STATE
{
	repeated CcStateInfo states = 1;
}

message S_DIED
{
	repeated DiedInfo deaths = 1;
}

message C_CHAT
{
	string msg = 1;
}

message S_CHAT
{
	uint64 playerId = 1;
	string msg = 2;
}

message C_SKILL
{
	EquipSlot slot = 1;
	uint64 target_id = 2;
	float aim_x = 3;
	float aim_y = 4;
}

message C_SKILL_CANCEL
{
}

message S_SKILL_CAST
{
	repeated SkillCastInfo casts = 1;
}

message S_SKILL_CANCEL
{
	repeated uint64 caster_ids = 1;
}

message S_SKILL_HIT
{
	repeated SkillHitInfo hits = 1;
}

message S_EQUIP_SYNC
{
	repeated SkillInfo skills = 1;
}

message C_GRANT_REWARD
{
	string request_id = 1;
	uint64 character_id = 2;
	uint64 gold = 3;
	string reason = 4;
}

message S_GRANT_REWARD
{
	string request_id = 1;
	uint32 result = 2;
	uint64 gold_after = 3;
}

message C_EQUIP
{
	string request_id = 1;
	uint64 instance_id = 2;
	EquipSlot slot = 3;
}

message C_UNEQUIP
{
	string request_id = 1;
	uint64 instance_id = 2;
}

message C_LOOT
{
	string request_id = 1;
	uint64 bag_id = 2;
	uint64 instance_id = 3;
}

message C_DROP
{
	string request_id = 1;
	uint64 instance_id = 2;
}

message S_ITEM_RESULT
{
	string request_id = 1;
	ItemResult result = 2;
	repeated ItemInstance changed = 3;
	optional uint64 gold = 4;		// vault gold after the op - only when it changed it (sell, enhance) 2026-10-17
}

message C_STASH
{
	string request_id = 1;
	uint64 instance_id = 2;
	bool to_vault = 3;
}

message S_INVENTORY_SYNC
{
	repeated ItemInstance items= 1;
	optional uint64 gold = 2;		// vault gold - base camp sync only (2026-10-17)
}

message S_BAG_CONTENTS
{
	uint64 bag_id = 1;
	repeated ItemInstance items = 2;
	uint64 remaining_ms = 3;
}

message C_BAG_OPEN
{
	uint64 bag_id = 1;
}

// New messages go at the end only - packet ids follow declaration order (ADR-0005)

// Escape tower gauge and alert (escape-timer.md Core Rule 10-12)
message S_ESCAPE_GAUGE
{
	uint32 tower_id = 1;				// 0 = alert only (position hidden). 1.. = tower on the floor (Ta=1, Tb=2, Tc=3)
	EscapeGaugeState state = 2;
	uint32 progress_permille = 3;		// 0..1000, 0 for alert only
	float rate_per_s = 4;				// progress per second (+1/60, -2/60, 0) - the client extrapolates
	bool self_in_zone = 5;				// the receiver is in the zone now
}

// Chest looted state (radar.md OQ-1) - radar and chest look know Sealed / Looted
message S_CHEST_STATE
{
	repeated uint64 looted_ids = 1;		// looted chest object ids (CHEST_ID_BASE + chest_id)
	bool snapshot = 2;					// true: the full list (absent = Sealed), false: just looted
}

// Status effects from skills - dots, buffs, marks (skill roster stage 1, 2026-10-10). Broadcast to the floor
message S_STATUS
{
	repeated StatusInfo applied = 1;	// also sent again on refresh / stack change
	repeated StatusInfo expired = 2;
}

// Projectiles - launched and ended this flush (skill roster stage 2, 2026-10-10). Clients fly them locally; the server judges
message S_PROJECTILE
{
	repeated ProjectileInfo spawned = 1;
	repeated ProjectileEndInfo ended = 2;
}

// Ground zones - placed and ended this flush (skill roster stage 3, 2026-10-10). Display only; ticks arrive as S_DAMAGE / S_CC
message S_ZONE
{
	repeated ZoneInfo spawned = 1;
	repeated uint64 ended = 2;
}

// Another character's skill loadout, revealed to one player only (helmet skill #91, 2026-10-10). Sent to the caster's session, never broadcast
message S_SKILL_REVEAL
{
	uint64 target_id = 1;
	repeated SkillInfo skills = 2;
	uint32 duration_ms = 3;
}

// Fog of war (design/gdd/fog-of-war.md, 2026-10-11) - my vision radius and extra vision sources. Sent to one player whenever they change
message S_VISION
{
	float radius_cm = 1;					// my current vision radius (blind and passives applied)
	repeated VisionSource sources = 2;		// the full list - replaces the previous one
	float camera_scale = 3;					// camera distance multiplier from passives (helmet 1132 wider sight) - blind does not move the camera
}

// PVE co-op party (2026-10-11 - ADR-0014). Invite by character name, up to 3. The invitee must be in base camp
message C_PARTY_INVITE
{
	string target_name = 1;
}

message S_PARTY_INVITED
{
	uint64 party_id = 1;
	string from_name = 2;
	uint32 expires_ms = 3;			// the invite is dropped after this
}

message C_PARTY_RESPONSE
{
	uint64 party_id = 1;
	bool accept = 2;
}

message C_PARTY_LEAVE
{
	uint64 character_id = 1;		// 0 = leave myself. Otherwise the leader removes that member
}

// The whole party - to every member on any change, and to a requester with the outcome. No members = not in a party
message S_PARTY_STATE
{
	uint64 party_id = 1;
	repeated PartyMember members = 2;
	bool in_run = 3;				// the party instance is alive - members in base camp may join it
	PartyResult result = 4;			// outcome of the receiver's last party request (OK otherwise)
	string subject_name = 5;		// who the result is about (invite target, decliner)
}

// The equipped weapon of a creature changed inside the room - everyone who sees it swaps stance (anim, 2026-10-12)
message S_WEAPON_CHANGE
{
	uint64 object_id = 1;
	uint32 weapon_type_id = 2;		// item_types.csv id, 0 = unarmed
}

// Base camp enhance: level + 1 for one owned item, no currency yet (item-enhance 2026-10-12). Answered with S_ITEM_RESULT{changed}
message C_ENHANCE
{
	string request_id = 1;
	uint64 instance_id = 2;
}

// Someone left a dungeon (PvP room) party - broadcast to the whole room, the leaver is marked for the rest of the run (party-betrayal 2026-10-12)
message S_PARTY_BETRAYED
{
	uint64 betrayer_id = 1;
	string betrayer_name = 2;
	uint64 party_id = 3;
	repeated string victim_names = 4;	// the members left behind
}

// Economy (2026-10-17, design/quick-specs/economy-loot-2026-10-17.md) - sell one carried or vaulted cell to the guild buyer, base camp only.
// Answered with S_ITEM_RESULT{changed = the cell gone (state NONE), gold = vault gold after}
message C_SELL
{
	string request_id = 1;
	uint64 instance_id = 2;
}

// Anti-cheat (2026-10-19, design/quick-specs/anticheat-2026-10-19.md) - sent right before the server closes the connection,
// so the client can say why instead of a bare "connection lost". banned_until = unix seconds, 0 = not suspended
message S_KICK
{
	KickReason reason = 1;
	uint64 banned_until = 2;
}

// Keep-alive (2026-10-21). The client sends one every 5 s; the server echoes client_ms and adds its own clock.
// Allowed before login. A logged-in connection that sends nothing for FBTK_IDLE_TIMEOUT_MS is closed (GameSessionManager::DropIdle) -
// TCP keepalive catches a dead host, this catches a hung client whose TCP stack still answers
message C_HEARTBEAT
{
	uint64 client_ms = 1;
}

message S_HEARTBEAT
{
	uint64 client_ms = 1;			// echoed - the client computes the round trip
	uint64 server_ms = 2;			// the server's steady clock (ms) - informational
}
