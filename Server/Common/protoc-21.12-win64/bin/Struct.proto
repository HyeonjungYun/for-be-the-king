syntax = "proto3";
package Protocol;

import "Enum.proto";

message PosInfo
{
	uint64 object_id = 1;
	float x = 2;
	float y = 3;
	float z = 4;
	float yaw = 5;
	MoveState state = 6;
}

message ObjectInfo
{
	uint64 object_id = 1;
	ObjectType object_type = 2;
	PosInfo pos_info = 3;
	CreatureType creature_type = 4;		// 0 = 미지정(구버전 - 플레이어로 다룬다) · PLAYER · MONSTER (monster-ai.md § H, 2026-10-07)
	uint32 monster_type_id = 5;			// MONSTER 일 때만 - Server/Data/monster_types.csv 의 id
	int32 hp = 6;						// 스폰 순간의 체력 (신입 스냅샷). 이후는 S_DAMAGE.remaining_hp
	int32 max_hp = 7;
}

message AttackInfo
{
	uint64 attacker_id = 1;
	uint64 target_id = 2;
	uint64 windup_ms = 3;
}

message DamageInfo
{
	uint64 attacker_id = 1;
	uint64 target_id = 2;
	int32 damage = 3;
	int32 remaining_hp = 4;
	bool is_crit = 5;
	DamageType damage_type = 6;
	int32 max_hp = 7;					// 0 = 그대로. 던전 안 장비 교체로 최대 체력이 바뀌었을 때만 싣는다 (재동기화 damage 0, 2026-10-08)
}

message CcEventInfo
{
	uint64 target_id = 1;
	uint64 instigator_id = 2;
	CcType cc_type = 3;
	uint32 duration_ms = 4;
	float magnitude = 5;
}

message KnockbackInfo
{
	uint64 target_id = 1;
	uint64 instigator_id = 2;
	float dir_x = 3;
	float dir_y = 4;
	float distance = 5;
	float speed = 6;
}

message CcSlot 
{
	CcType cc_type = 1;
	uint32 remaining_ms = 2;
	float magnitude = 3;
}

message CcStateInfo
{
	uint64 target_id = 1;
	repeated CcSlot slots = 2;
	float active_slow = 3;
}

message DiedInfo
{
	uint64 victim_id = 1;
	uint64 instigator_id = 2;
	DeathCause cause = 3;
}

message SkillInfo 
{
	EquipSlot slot = 1;
	uint32 skill_id = 2;
	SlotBindState bind_state = 3;
	EquipSlot shadowed_by = 4;
}

message SkillCastInfo
{
	uint64 caster_id = 1;
	bool is_stationary = 2;
}

message SkillHitInfo
{
	uint64 caster_id = 1;
	uint32 effect_id = 2;
	uint64 target_id = 3;
	float impact_x = 4;
	float impact_y = 5;
	float aim_x = 6;			// where the skill was aimed - lines / cones / projectiles need a direction to draw (2026-10-10)
	float aim_y = 7;
}

// 상태 효과 하나 - 걸림(applied) · 끝남(expired). 걸림은 갱신 · 중첩 증가에도 다시 온다 (skill-roster 1 단계, 2026-10-10)
message StatusInfo
{
	uint64 target_id = 1;
	StatusKind kind = 2;
	string param = 3;			// dot: bleed · poison · burn · heavy_bleed / buff: attack_power … / mark: spear · arrow · blood · heavy_bleed · rope
	uint32 stacks = 4;			// dot 중첩 수. 그 외 1
	uint32 remaining_ms = 5;
	float magnitude = 6;		// buff 증가율 등
	uint64 instigator_id = 7;	// 건 사람 (표식 소유자)
}

message CharacterInfo
{
	ObjectInfo object_info = 1;
	string name = 2;
	int32 hp = 3;
	int32 max_hp = 4;
	uint32 floor_id = 5;
}

message ItemInstance
{
	uint64 instance_id = 1;
	uint32 item_type_id = 2;
	ItemGrade grade = 3;
	uint32 level = 4;
	ItemState state = 5;
	EquipSlot slot = 6;
	repeated SkillInfo skills = 7;
}
