syntax = "proto3";
package Protocol;

import "Enum.proto";

message PosInfo
{
	uint64 object_id = 1;
	float x = 2;
	float y = 3;
	float z = 4;
	float yaw = 5;
	MoveState state = 6;
}

message ObjectInfo
{
	uint64 object_id = 1;
	ObjectType object_type = 2;
	PosInfo pos_info = 3;
}

message AttackInfo
{
	uint64 attacker_id = 1;
	uint64 target_id = 2;
	uint64 windup_ms = 3;
}

message DamageInfo
{
	uint64 attacker_id = 1;
	uint64 target_id = 2;
	int32 damage = 3;
	int32 remaining_hp = 4;
	bool is_crit = 5;
	DamageType damage_type = 6;
}

message CcEventInfo
{
	uint64 target_id = 1;
	uint64 instigator_id = 2;
	CcType cc_type = 3;
	uint32 duration_ms = 4;
	float magnitude = 5;
}

message KnockbackInfo
{
	uint64 target_id = 1;
	uint64 instigator_id = 2;
	float dir_x = 3;
	float dir_y = 4;
	float distance = 5;
	float speed = 6;
}

message CcSlot 
{
	CcType cc_type = 1;
	uint32 remaining_ms = 2;
	float magnitude = 3;
}

message CcStateInfo
{
	uint64 target_id = 1;
	repeated CcSlot slots = 2;
	float active_slow = 3;
}

message DiedInfo
{
	uint64 victim_id = 1;
	uint64 instigator_id = 2;
	DeathCause cause = 3;
}

message SkillInfo 
{
	EquipSlot slot = 1;
	uint32 skill_id = 2;
	SlotBindState bind_state = 3;
	EquipSlot shadowed_by = 4;
}

message SkillCastInfo
{
	uint64 caster_id = 1;
	bool is_stationary = 2;
}

message SkillHitInfo
{
	uint64 caster_id = 1;
	uint32 effect_id = 2;
	uint64 target_id = 3;
	float impact_x = 4;
	float impact_y = 5;
}