syntax = "proto3";
package Protocol;

import "Enum.proto";

message PosInfo
{
	uint64 object_id = 1;
	float x = 2;
	float y = 3;
	float z = 4;
	float yaw = 5;
	MoveState state = 6;
}

message ObjectInfo
{
	uint64 object_id = 1;
	ObjectType object_type = 2;
	PosInfo pos_info = 3;
	CreatureType creature_type = 4;		// 0 = 미지정(구버전 - 플레이어로 다룬다) · PLAYER · MONSTER (monster-ai.md § H, 2026-10-07)
	uint32 monster_type_id = 5;			// MONSTER 일 때만 - Server/Data/monster_types.csv 의 id
	int32 hp = 6;						// 스폰 순간의 체력 (신입 스냅샷). 이후는 S_DAMAGE.remaining_hp
	int32 max_hp = 7;
}

message AttackInfo
{
	uint64 attacker_id = 1;
	uint64 target_id = 2;
	uint64 windup_ms = 3;
}

message DamageInfo
{
	uint64 attacker_id = 1;
	uint64 target_id = 2;
	int32 damage = 3;
	int32 remaining_hp = 4;
	bool is_crit = 5;
	DamageType damage_type = 6;
	int32 max_hp = 7;					// 0 = 그대로. 던전 안 장비 교체로 최대 체력이 바뀌었을 때만 싣는다 (재동기화 damage 0, 2026-10-08)
}

message CcEventInfo
{
	uint64 target_id = 1;
	uint64 instigator_id = 2;
	CcType cc_type = 3;
	uint32 duration_ms = 4;
	float magnitude = 5;
}

message KnockbackInfo
{
	uint64 target_id = 1;
	uint64 instigator_id = 2;
	float dir_x = 3;
	float dir_y = 4;
	float distance = 5;
	float speed = 6;
}

message CcSlot 
{
	CcType cc_type = 1;
	uint32 remaining_ms = 2;
	float magnitude = 3;
}

message CcStateInfo
{
	uint64 target_id = 1;
	repeated CcSlot slots = 2;
	float active_slow = 3;
}

message DiedInfo
{
	uint64 victim_id = 1;
	uint64 instigator_id = 2;
	DeathCause cause = 3;
}

message SkillInfo 
{
	EquipSlot slot = 1;
	uint32 skill_id = 2;
	SlotBindState bind_state = 3;
	EquipSlot shadowed_by = 4;
}

message SkillCastInfo
{
	uint64 caster_id = 1;
	bool is_stationary = 2;
}

message SkillHitInfo
{
	uint64 caster_id = 1;
	uint32 effect_id = 2;
	uint64 target_id = 3;
	float impact_x = 4;
	float impact_y = 5;
	float aim_x = 6;			// where the skill was aimed - lines / cones / projectiles need a direction to draw (2026-10-10)
	float aim_y = 7;
}

// 상태 효과 하나 - 걸림(applied) · 끝남(expired). 걸림은 갱신 · 중첩 증가에도 다시 온다 (skill-roster 1 단계, 2026-10-10)
message StatusInfo
{
	uint64 target_id = 1;
	StatusKind kind = 2;
	string param = 3;			// dot: bleed · poison · burn · heavy_bleed / buff: attack_power … / mark: spear · arrow · blood · heavy_bleed · rope
	uint32 stacks = 4;			// dot 중첩 수. 그 외 1
	uint32 remaining_ms = 5;
	float magnitude = 6;		// buff 증가율 등
	uint64 instigator_id = 7;	// 건 사람 (표식 소유자)
}

// 투사체 발사 - 클라는 이 값으로 스스로 날려 그린다. 판정은 서버 (skill-roster 2 단계, 2026-10-10)
message ProjectileInfo
{
	uint64 projectile_id = 1;
	uint64 caster_id = 2;
	uint32 effect_id = 3;		// 0 = 평타 (활 · 스태프)
	float x = 4;
	float y = 5;
	float dir_x = 6;
	float dir_y = 7;
	float speed_cms = 8;
	float range_cm = 9;			// 직선 - 최대 비행 거리. 유도(target_id)면 0
	float radius_cm = 10;
	uint64 target_id = 11;		// 0 이 아니면 유도 - 대상을 쫓아간다 (필중, 날아가는 중 벽에 막힘)
}

message ProjectileEndInfo
{
	uint64 projectile_id = 1;
	float x = 2;
	float y = 3;
	ProjectileEnd reason = 4;
	uint64 target_id = 5;		// HIT 일 때 맞은 대상
}

// 장판 (skill-roster 3 단계, 2026-10-10) - 바닥 원. 클라는 지속 시간 동안 그린다, 틱 피해 · 감속은 서버가 S_DAMAGE · S_CC 로
message ZoneInfo
{
	uint64 zone_id = 1;
	uint64 caster_id = 2;
	uint32 effect_id = 3;
	float x = 4;
	float y = 5;
	float radius_cm = 6;
	uint32 duration_ms = 7;
	string param = 8;			// poison · fire_path · element_path · mist · arrows (색)
	float yaw = 9;				// param wall (지각변동) - 벽 방향 (도). 원 장판은 0
	float half_length = 10;		// param wall - 벽 반길이 (cm)
	float half_thickness = 11;	// param wall - 벽 반두께 (cm)
}

message CharacterInfo
{
	ObjectInfo object_info = 1;
	string name = 2;
	int32 hp = 3;
	int32 max_hp = 4;
	uint32 floor_id = 5;
}

message ItemInstance
{
	uint64 instance_id = 1;
	uint32 item_type_id = 2;
	ItemGrade grade = 3;
	uint32 level = 4;
	ItemState state = 5;
	EquipSlot slot = 6;
	repeated SkillInfo skills = 7;
}

// FoW 추가 시야원 하나 (design/gdd/fog-of-war.md, 2026-10-11) - 그림자 분신 · 종이매 · 맹수의 탐색. 주인에게만 S_VISION 으로
message VisionSource
{
	uint64 source_id = 1;
	uint64 follow_id = 2;		// 0 = 고정 지점 (x, y). 아니면 그 생물을 따라간다 - 클라에 스폰돼 있다 (시야원이 자기 중심을 보므로)
	float x = 3;
	float y = 4;
	float radius_cm = 5;
	uint32 remaining_ms = 6;		// 0 = 따라가는 생물이 있는 동안
	bool needs_los = 7;			// false = 벽 너머도 본다
	bool sees_stealth = 8;
}
