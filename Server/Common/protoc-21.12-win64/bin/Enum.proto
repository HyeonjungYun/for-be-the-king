syntax = "proto3";
package Protocol;

enum ObjectType
{
	OBJECT_TYPE_NONE = 0;
	OBJECT_TYPE_CREATURE = 1;
	OBJECT_TYPE_PROJECTILE = 2;
	OBJECT_TYPE_ENV = 3;
}	

enum CreatureType
{
	CREATE_TYPE_NONE = 0;
	CREATE_TYPE_PLAYER = 1;
	CREATE_TYPE_MONSTER = 2;
	CREATE_TYPE_NPC = 3;
}

enum PlayerType
{
	PLAYER_TYPE_NONE = 0;
	PLAYER_TYPE_KNIGHT = 1;
	PLAYER_TYPE_MAGE = 2;
	PLAYER_TYPE_ARCHER = 3;
}

enum MoveState
{
	MOVE_STATE_NONE = 0;
	MOVE_STATE_IDLE = 1;
	MOVE_STATE_RUN= 2;
	MOVE_STATE_SKILL = 3;
}

enum DamageType
{
	DAMAGE_TYPE_PHYSICAL = 0;
	DAMAGE_TYPE_MAGIC = 1;
}

enum CcType
{
	CC_TYPE_NONE = 0;
	CC_TYPE_STUN = 1;
	CC_TYPE_ROOT = 2;
	CC_TYPE_KNOCKBACK = 4;
	CC_TYPE_LAUNCH = 8;
	CC_TYPE_SLOW = 16;
	CC_TYPE_HEAL_REDUCTION = 32;
	CC_TYPE_SILENCE = 64;
}

enum DeathCause
{
	DEATH_CAUSE_NONE = 0;
	DEATH_CAUSE_PLAYER = 1;
	DEATH_CAUSE_MONSTER = 2;
}

enum EquipSlot
{
	SLOT_NONE = 0;
	SLOT_WEAPON_PRIMARY = 1;
	SLOT_WEAPON_SECONDARY = 2;
	SLOT_HELMET = 3;
	SLOT_ARMOR = 4;
	SLOT_BOOTS = 5;
	SLOT_TRINKET = 6;
}

enum SlotBindState
{
	BIND_UNBOUND = 0;
	BIND_BOUND = 1;
	BIND_SHADOWED = 2;
}