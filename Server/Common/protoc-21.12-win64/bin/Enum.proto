syntax = "proto3";
package Protocol;

enum ObjectType
{
	OBJECT_TYPE_NONE = 0;
	OBJECT_TYPE_CREATURE = 1;
	OBJECT_TYPE_PROJECTILE = 2;
	OBJECT_TYPE_ENV = 3;
	OBJECT_TYPE_BAG = 4;
}	

// What dropped a bag (monster-ai.md OQ-3, 2026-10-18) - a death bag is P4 information ("someone died here"), a monster bag is not
enum BagKind
{
	BAG_KIND_NONE = 0;
	BAG_KIND_DEATH = 1;
	BAG_KIND_MONSTER = 2;
}

enum CreatureType
{
	CREATE_TYPE_NONE = 0;
	CREATE_TYPE_PLAYER = 1;
	CREATE_TYPE_MONSTER = 2;
	CREATE_TYPE_NPC = 3;
}

enum PlayerType
{
	PLAYER_TYPE_NONE = 0;
	PLAYER_TYPE_KNIGHT = 1;
	PLAYER_TYPE_MAGE = 2;
	PLAYER_TYPE_ARCHER = 3;
}

enum MoveState
{
	MOVE_STATE_NONE = 0;
	MOVE_STATE_IDLE = 1;
	MOVE_STATE_RUN= 2;
	MOVE_STATE_SKILL = 3;
}

enum DamageType
{
	DAMAGE_TYPE_PHYSICAL = 0;
	DAMAGE_TYPE_MAGIC = 1;
}

enum CcType
{
	CC_TYPE_NONE = 0;
	CC_TYPE_STUN = 1;
	CC_TYPE_ROOT = 2;
	CC_TYPE_KNOCKBACK = 4;
	CC_TYPE_LAUNCH = 8;
	CC_TYPE_SLOW = 16;
	CC_TYPE_HEAL_REDUCTION = 32;
	CC_TYPE_SILENCE = 64;
	CC_TYPE_BLIND = 128;		// soft - the client shrinks the view (skill_rules.csv blind_view_scale). 2026-10-10 skill roster
	CC_TYPE_TAUNT = 256;		// hard - walks slowly toward the instigator (server moves it), no attack / skill / turn (2026-10-10 user request)
}

enum DeathCause
{
	DEATH_CAUSE_NONE = 0;
	DEATH_CAUSE_PLAYER = 1;
	DEATH_CAUSE_MONSTER = 2;
}

enum EquipSlot
{
	SLOT_NONE = 0;
	SLOT_WEAPON_PRIMARY = 1;
	SLOT_WEAPON_SECONDARY = 2;
	SLOT_HELMET = 3;
	SLOT_ARMOR = 4;
	SLOT_BOOTS = 5;
	SLOT_TRINKET = 6;
}

enum SlotBindState
{
	BIND_UNBOUND = 0;
	BIND_BOUND = 1;
	BIND_SHADOWED = 2;
}

enum GrantResult
{
	GRANT_OK = 0;
	GRANT_ALREADY = 1;
	GRANT_NO_TARGET = 2;
	GRANT_DB_ERROR = 3;
	GRANT_BAD_REQUEST = 4;
}

enum ItemGrade
{
	ITEM_GRADE_NONE = 0;
	ITEM_GRADE_COMMON = 1;
	ITEM_GRADE_RARE = 2;
	ITEM_GRADE_EPIC = 3;
	ITEM_GRADE_LEGENDARY = 4;
}

enum ItemState
{
	ITEM_STATE_NONE = 0;
	ITEM_STATE_CARRIED = 1;
	ITEM_STATE_EQUIPPED = 2;
	ITEM_STATE_VAULTED = 3;
	ITEM_STATE_IN_BAG = 4;
}

// 탈출 타워 게이지 (design/gdd/escape-timer.md § Packets, 2026-10-07)
enum EscapeGaugeState
{
	ESCAPE_GAUGE_IDLE = 0;
	ESCAPE_GAUGE_FILLING = 1;
	ESCAPE_GAUGE_DRAINING = 2;
	ESCAPE_GAUGE_COMPLETED = 3;
}

// 런이 어떻게 끝났나 - S_LEAVE_GAME 결과 안내 (escape-timer.md)
enum RunEndReason
{
	RUN_END_NONE = 0;			// 기존 C_LEAVE_GAME 응답 등 - 호환
	RUN_END_ESCAPED = 1;
	RUN_END_EXPIRED = 2;
}

enum ItemResult
{
	ITEM_OK = 0;
	ITEM_ALREADY = 1;
	ITEM_NOT_FOUND = 2;
	ITEM_INVALID_STATE = 3;
	ITEM_INVENTORY_FULL = 4;
	ITEM_BAD_REQUEST = 5;
	ITEM_DB_ERROR = 6;
	ITEM_LONE_PATH_IN_PARTY = 7;	// a lone path item cannot be worn while in a party (2026-10-17)
	ITEM_NOT_ENOUGH_GOLD = 8;		// enhance costs more vault gold than there is (2026-10-17 economy)
}

// 스킬 상태 효과 종류 - S_STATUS (skill-roster 1 단계, 2026-10-10). param 이 세부(출혈 종류 · 버프 스탯 · 표식 종류 · 속성)
enum StatusKind
{
	STATUS_NONE = 0;
	STATUS_DOT = 1;			// 지속 피해 - stacks 가 중첩 수
	STATUS_BUFF = 2;		// 자기 버프 - magnitude 가 증가율 (강화 레벨 포함)
	STATUS_MARK = 3;		// 표식 - instigator 의 것만 그 사람이 쓴다
	STATUS_STANCE = 4;		// 스태프 속성 (3 단계)
	STATUS_INVULN = 5;		// 니힐 (4 단계)
	STATUS_COUNTER = 6;		// 정좌 (3 단계)
	STATUS_PARRY = 7;		// 유수 (3 단계)
	STATUS_HOLD = 8;		// 유지형 진행 중 (3 단계)
	STATUS_DECOY = 9;		// 미끼 (4 단계)
	STATUS_STEALTH = 10;		// 은신 - 그림자 감추기 · 니힐 (FoW, 2026-10-11). 다른 사람에겐 안 보이므로 본인만 받는다
	STATUS_COOLDOWN = 11;		// 패시브 쿨다운 시작 (염두 · 맹수의 본능, 2026-10-11) - param = 스킬 id, remaining_ms = 쿨다운. 본인만 받는다
}

// 투사체가 끝난 이유 - S_PROJECTILE.ended (skill-roster 2 단계, 2026-10-10)
enum ProjectileEnd
{
	PROJECTILE_END_EXPIRED = 0;	// 사거리 끝
	PROJECTILE_END_HIT = 1;		// 맞았다 (target_id)
	PROJECTILE_END_WALL = 2;	// 벽에 막혔다
	PROJECTILE_END_LOST = 3;	// 시전자 · 대상이 사라졌다
}

// Which room C_ENTER_GAME goes to (PVE modes, 2026-10-11 - ADR-0014)
enum RunMode
{
	RUN_MODE_PVP = 0;			// the shared floor room - default for old clients and bots
	RUN_MODE_PVE_SOLO = 1;		// a private copy of the floor for one player
	RUN_MODE_PVE_COOP = 2;		// the party's private copy, up to 3 party members
	RUN_MODE_BASECAMP = 3;		// the player's private base camp room - the client asks for it in C_ENTER_GAME (S1BaseCampSubsystem::RequestCampMap) and the server echoes it in S_ENTER_GAME (2026-10-17)
}

// Outcome of a party request - S_PARTY_STATE.result
enum PartyResult
{
	PARTY_OK = 0;
	PARTY_NOT_FOUND = 1;			// no such character online in base camp
	PARTY_FULL = 2;					// 3 members already
	PARTY_ALREADY_IN_PARTY = 3;		// the target is in another party
	PARTY_DECLINED = 4;
	PARTY_EXPIRED = 5;				// the invite timed out or the party is gone
	PARTY_NOT_LEADER = 6;
	PARTY_BUSY = 7;					// entering, a run end commit pending, a detached body, or in a run
	PARTY_SELF = 8;
	PARTY_NO_INSTANCE = 9;			// join asked while the party has no running instance
	PARTY_ALREADY_ENTERED = 10;		// this character already entered this instance once
	PARTY_COOP_ONLY = 11;			// a party of 2 or more may only enter PVE co-op
	PARTY_NOT_VISIBLE = 12;			// dungeon invite: the target is not in my room or not in my sight (party-betrayal 2026-10-12)
	PARTY_NO_KICK_IN_RUN = 13;		// dungeon party: no kicking - only leaving (= betrayal)
	PARTY_LONE_PATH = 14;			// the inviter or the target wears a lone path item (2026-10-17)
}

enum PartyMemberState
{
	PARTY_MEMBER_BASECAMP = 0;
	PARTY_MEMBER_IN_RUN = 1;
	PARTY_MEMBER_OFFLINE = 2;
}

// Why the server is closing this connection - S_KICK (anti-cheat 2026-10-19, design/quick-specs/anticheat-2026-10-19.md)
enum KickReason
{
	KICK_REASON_NONE = 0;
	KICK_REASON_CHEAT_SUSPECT = 1;	// too many rejected actions in a short time (CheatGuard kick score)
	KICK_REASON_BANNED = 2;			// the account is suspended until banned_until
	KICK_REASON_DUPLICATE_LOGIN = 3;	// the same account logged in from another connection - this older one is closed (2026-10-21)
	KICK_REASON_SERVER_SHUTDOWN = 4;	// the server is shutting down cleanly (2026-10-21)
}
